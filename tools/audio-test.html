<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lydtest</title>
<meta name="description" content="Prøv lyden fra sim/audio/: motorstemmene, dekk og underlag, natur og hendelser, med ekte fysikk eller et skript.">
<style>
/* Dev page for sim/audio/: same dark theme as the game. */
:root{--sand:#E5A92B;--ink:#14120E;--ink-2:#1F1B15;--paper:#F2E8D0;--muted:#B5A988;--line:rgba(229,169,43,.32);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.35 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;padding:16px;max-width:980px}
h1{margin:0 0 4px;font-size:1.4rem;color:var(--sand);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 10px;color:var(--muted)}
fieldset{border:1px solid var(--line);margin:0 0 12px;padding:8px 10px 10px}
legend{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;padding:0 4px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;color:var(--paper);background:var(--ink-2);border:1px solid var(--line);padding:6px 10px;border-radius:2px;cursor:pointer}
button:hover,button.on{border-color:var(--sand);color:var(--sand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
label{display:flex;flex-direction:column;font-size:.9rem;color:var(--muted)}
input[type=range]{accent-color:var(--sand)}
pre{margin:0;background:var(--ink-2);border:1px solid var(--line);padding:8px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
</head>
<body>
<h1>Lydtest</h1>
<p>Velg bil, trykk «Lås opp lyd», og kjør selv (piltaster, mellomrom = håndbrekk, H = horn) eller spill et skript.</p>
<fieldset><legend>Bil (motorstemme)</legend><div class="btns" id="cars"></div></fieldset>
<fieldset><legend>Kjøring</legend><div class="btns">
  <button id="unlock">Lås opp lyd</button><button data-mode="live">Kjør selv (fysikk)</button>
  <button data-mode="sweep">Turtall opp, sperre, slipp</button><button data-mode="steady">Fast turtall</button>
  <button data-mode="road">Underlag</button><button data-mode="ambient">Natur</button><button data-mode="events">Hendelser</button><button data-mode="drive">Fysikk: gass, slipp, brems</button>
  <button id="stop">Stopp</button><button id="wav">Lag WAV av skriptet</button>
  <select id="surf" title="Underlag i «Kjør selv»"></select><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="water"> vann 30 cm</label>
</div></fieldset>
<fieldset><legend>Omgivelser og volum</legend><div class="grid" id="sliders"></div></fieldset>
<fieldset><legend>Hendelser</legend><div class="btns">
  <button id="horn">Horn (hold)</button><button data-ev="shift">Girskift</button><button data-ev="door">Dør</button>
  <button data-ev="splash" data-o='{"size":0.7}'>Plask</button><button data-ev="crash" data-o='{"impulse":1500}'>Lite støt</button>
  <button data-ev="crash" data-o='{"impulse":40000}'>Stort krasj</button><button data-ev="gravelHit">Stein</button><button data-ev="click">Klikk</button>
</div></fieldset>
<pre id="out">–</pre>
<script type="module">
import { Sound } from '../sim/audio/audio.js';
import { voiceFor, firingHz } from '../sim/audio/engine.js';
import { CARS, carById } from '../sim/data/cars.js';
import { SURF, SURF_NAME } from '../sim/physics/surfaces.js';
import { Vehicle } from '../sim/physics/vehicle.js';
import { flatWorld } from '../sim/world/flat.js';

const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// a stand-in for the Vehicle with the fields the sound reads
function fakeCar(spec) {
  const wheel = (front, i) => ({ front, contact: true, Fz: 4000, Fz0: 4000, surf: SURF.ASPHALT, slipV: 0, slip: 0, vLong: 0, omega: 0, r: front ? spec.wheel.rF : spec.wheel.rR, wd: -1 });
  return { spec, tyre: spec.tyre, rpm: spec.engine.idle, speed: 0, lastHit: null, engineOff: false,
    state: { load: 0, throttle: 0, thr: 0.2, boost: 0, shift: 0, shiftTo: 1, gear: 1, absOn: false, flooded: false, depth: -1 },
    wheels: [wheel(true), wheel(true), wheel(false), wheel(false)] };
}
function roll(car, v, o = {}) {   // all wheels rolling at v on surface o.surf
  car.speed = v;
  for (const w of car.wheels) Object.assign(w, { surf: o.surf ?? SURF.ASPHALT, vLong: v, omega: v / w.r, slipV: o.slipV ?? 0.15, slip: o.slip ?? 0.08, wd: o.wd ?? -1, Fz: w.Fz0, contact: true });
}
function idle(car) { const st = car.state; car.rpm = car.spec.engine.idle; st.load = 0; st.throttle = 0; st.thr = 0.2; }
// scripted runs: step(t, dt, snd) sets the fake car for time t; segs: what happens when (for the analysis)
const SC = {
  // four held engine speeds: idle, then 30/60/90 % of the way to the redline at full load (the frequency check)
  steady(spec) {
    const e = spec.engine, car = fakeCar(spec), D = 1.6;
    const rpms = [e.idle, ...[0.3, 0.6, 0.9].map(k => Math.round((e.idle + k * (e.redline - e.idle)) / 50) * 50)];
    const segs = rpms.map((rpm, i) => ({ t0: i * D, t1: (i + 1) * D, rpm, load: i ? 0.95 : 0, f: firingHz(spec, rpm), label: i ? `${rpm} rpm full last` : 'tomgang', en: i ? `${rpm} rpm full load` : 'idle' }));
    return { car, segs, dur: segs.length * D, env: {}, step(t) {
      const s = segs[Math.min(segs.length - 1, Math.floor(t / D))], st = car.state, full = s.load > 0;
      car.rpm = s.rpm; st.load = s.load; st.throttle = full ? 1 : 0; st.thr = full ? 1 : 0.2; st.boost = full && e.turbo ? 1 : 0;
    } };
  },
  // idle, full throttle up to the limiter, hold it there, lift (overrun, pops, blow-off), idle
  sweep(spec) {
    const e = spec.engine, car = fakeCar(spec), lim = e.limiter ?? e.redline + 200;
    const segs = [{ key: 'idle', t0: 0, t1: 1, label: 'tomgang', rpm: e.idle },
      { key: 'run', t0: 1, t1: 5, label: 'full gass opp', rpm0: e.idle, rpm1: lim, pow: 0.85, f0: firingHz(spec, e.idle), f1: firingHz(spec, lim) },
      { key: 'limiter', t0: 5, t1: 6.5, label: 'turtallssperre', rpm: lim }, { key: 'lift', t0: 6.5, t1: 9, label: 'slipper gassen' }, { key: 'idle2', t0: 9, t1: 10.5, label: 'tomgang' }];
    return { car, segs, dur: 10.5, env: {}, step(t, dt) {
      const st = car.state; let rpm = e.idle, load = 0, thr = 0;
      if (t >= 1 && t < 5) { rpm = e.idle + (lim - e.idle) * Math.pow((t - 1) / 4, 0.85); load = 0.95; thr = 1; }
      else if (t >= 5 && t < 6.5) { rpm = lim * (1 + 0.004 * Math.sin(t * 90)); load = Math.random() < 0.5 ? 0.9 : -0.2; thr = 1; }
      else if (t >= 6.5 && t < 9) { const k = (t - 6.5) / 2.5; rpm = e.idle * 1.2 + (lim - e.idle * 1.2) * (1 - k) ** 1.5; load = -0.2; }
      car.rpm = rpm; st.load = load; st.throttle = thr; st.thr = thr || (rpm < e.idle * 1.1 ? 0.2 : 0);
      if (e.turbo) { const want = thr * smooth(e.idle * 1.1, e.idle * 2.6, rpm); st.boost += (want - st.boost) * (1 - Math.exp(-dt / (want > st.boost ? 0.4 : 0.18))); }
      roll(car, rpm / lim * 22);
    } };
  },
  // the same car rolling at 15 m/s over each surface, then squeal, ABS, wheelspin and water
  road(spec) {
    const car = fakeCar(spec), D = 1.5;
    const list = [['ASPHALT'], ['CONCRETE'], ['GRAVEL'], ['DIRT', 'bump'], ['GRASS'], ['FOREST'], ['MUD'], ['SNOW'], ['WOOD'], ['COBBLE'], ['ASPHALT', 'squeal'], ['ASPHALT', 'abs'], ['GRAVEL', 'spin'], ['DIRT', 'water']];
    const segs = list.map(([s, x], i) => ({ t0: i * D, t1: (i + 1) * D, label: SURF_NAME[SURF[s]] + (x ? ' ' + x : ''), en: s.toLowerCase() + (x ? ' ' + x : '') }));
    return { car, segs, dur: list.length * D, env: {}, step(t) {
      const i = Math.min(list.length - 1, Math.floor(t / D)), [s, x] = list[i], u = t - i * D, st = car.state;
      car.rpm = 2200; st.load = 0.3; st.throttle = 0.3; st.thr = 0.3; st.absOn = x === 'abs';
      roll(car, x === 'abs' ? 15 - 5 * u : 15, { surf: SURF[s], wd: x === 'water' ? 0.3 : -1 });
      if (x === 'squeal') car.wheels.forEach((w, k) => Object.assign(w, { slip: k < 2 ? 1.6 : 2.3, slipV: k < 2 ? 5 : 8 }));
      if (x === 'abs') car.wheels.forEach(w => Object.assign(w, { slip: 0.95, slipV: 3.5 }));
      if (x === 'spin') car.wheels.forEach(w => Object.assign(w, { slip: 2.5, slipV: 7 }));
      if (x === 'bump' && u > 0.7 && u < 0.75) car.wheels[0].Fz = car.wheels[0].Fz0 * 2.6;
    } };
  },
  // the world without the engine: forest by day, wind, sea, rain outside and inside, night, town
  ambient(spec) {
    const car = fakeCar(spec), D = 4; car.engineOff = true;
    const list = [['skog dag', { forest: 1 }, 'forest, day'], ['skog og vind', { forest: 1, wind: 0.8 }, 'forest + wind'], ['sjø', { sea: 1 }, 'sea'],
      ['regn ute', { rain: 1 }, 'rain, outside'], ['regn inne', { rain: 1, inside: 1 }, 'rain, inside'], ['natt i skogen', { forest: 0.8, night: 1 }, 'forest, night'], ['by', { town: 1 }, 'town']];
    const segs = list.map(([l, , en], i) => ({ t0: i * D, t1: (i + 1) * D, label: l, en })), env = {};
    return { car, segs, dur: list.length * D, env, step(t) {
      const i = Math.min(list.length - 1, Math.floor(t / D));
      for (const k of ['inside', 'sea', 'forest', 'rain', 'wind', 'night', 'town']) env[k] = list[i][1][k] || 0;
    } };
  },
  // the real physics (sim/physics/vehicle.js) on a flat tarmac track: full throttle through the gears, lift, then a hard
  // stop (ABS). track: what the physics did each frame, so the analysis can hold the sound up against the real revs
  drive(spec) {
    const world = flatWorld(), car = new Vehicle(spec), DT = 1 / 400, track = [];
    car.place(world, 0, 0, 0); for (let i = 0; i < 400; i++) car.step(DT, world);
    const segs = [{ t0: 0, t1: 8, label: 'full gass' }, { t0: 8, t1: 9.5, label: 'slipper' }, { t0: 9.5, t1: 12, label: 'full brems' }];
    let acc = 0;
    return { car, segs, track, dur: 12, env: {}, step(t, dt) {
      const I = car.input, ramp = (v, on, r) => on ? Math.min(1, v + dt * r) : Math.max(0, v - dt * r * 2);   // the pedals as game.js ramps them
      I.gas = ramp(I.gas, t < 8, 3); I.brake = ramp(I.brake, t >= 9.5, 4);
      acc += dt; while (acc >= DT) { car.step(DT, world); acc -= DT; }
      track.push([+t.toFixed(4), Math.round(car.rpm), car.state.gear, car.state.shift > 0 ? 1 : 0, car.state.absOn ? 1 : 0]);
    } };
  },
  // one-shots
  events(spec) {
    const car = fakeCar(spec), list = [[0.3, s => s.event('door')], [1.0, s => s.event('horn', { on: true })], [1.6, s => s.event('horn', { on: false })],
      [2.0, s => s.event('crash', { impulse: 1500 })], [2.8, s => s.event('crash', { impulse: 40000 })], [4.2, s => s.event('splash', { size: 0.7 })],
      [5.0, s => s.event('shift')], [5.3, s => s.event('gravelHit', { size: 1 })], [5.6, s => s.event('click')]];
    const segs = [{ t0: 0, t1: 1, label: 'dør', en: 'door' }, { t0: 1, t1: 1.9, label: 'horn', en: 'horn' }, { t0: 2, t1: 2.7, label: 'lite støt', en: 'crash 1500 N·s' },
      { t0: 2.8, t1: 4.1, label: 'krasj', en: 'crash 40000 N·s' }, { t0: 4.2, t1: 5, label: 'plask', en: 'splash' }, { t0: 5, t1: 6.5, label: 'gir, stein, klikk', en: 'shift, stone, click' }];
    let k = 0;
    return { car, segs, dur: 6.5, env: {}, step(t, dt, snd) { idle(car); while (k < list.length && list[k][0] <= t) list[k++][1](snd); } };
  },
};

// render a script offline (as fast as the CPU allows) and return 16-bit PCM in base64, the peak and the script's segments
async function renderOffline(id, name, o = {}) {
  const spec = carById(id), sc = SC[name](spec), sr = o.sr || 48000, n = Math.ceil(sc.dur * sr), FR = 60, step = 1 / FR;
  if (o.engineOff) sc.car.engineOff = true;
  const ac = new OfflineAudioContext(2, n, sr), snd = new Sound({ context: ac, worklet: o.worklet !== false });
  await snd.unlock(); snd.setCar(spec);
  const events = {}, emit = snd.emit; snd.emit = (n, e) => { events[n] = (events[n] || 0) + 1; emit(n, e); };   // count what update() fired
  const env = () => Object.assign({}, o.env || {}, sc.env, o.inside != null ? { inside: o.inside } : {});
  const tick = k => { sc.step(k * step, step, snd); snd.update(step, sc.car, env()); };
  const next = k => { if (k * step >= sc.dur - step) return; ac.suspend(k * step).then(() => { tick(k); next(k + 1); ac.resume(); }); };
  tick(0); next(1);
  const buf = await ac.startRendering(), ch = [buf.getChannelData(0), buf.getChannelData(1)], pcm = new Int16Array(n * 2);
  let peak = 0, over = 0;
  for (let i = 0; i < n; i++) for (let c = 0; c < 2; c++) { const x = ch[c][i], a = Math.abs(x); if (a > peak) peak = a; if (a >= 1) over++; pcm[i * 2 + c] = clamp(Math.round(x * 32767), -32768, 32767); }
  const bytes = new Uint8Array(pcm.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { id, name, sr, n, peak, over, worklet: snd.worklet, voice: voiceFor(spec).layout, cyl: voiceFor(spec).cyl, segs: sc.segs, track: sc.track, events, b64: btoa(s) };
}
function wavBlob(pcm, sr) {
  const h = new DataView(new ArrayBuffer(44)), w = (o, s) => [...s].forEach((c, i) => h.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); h.setUint32(4, 36 + pcm.byteLength, true); w(8, 'WAVEfmt '); h.setUint32(16, 16, true); h.setUint16(20, 1, true); h.setUint16(22, 2, true);
  h.setUint32(24, sr, true); h.setUint32(28, sr * 4, true); h.setUint16(32, 4, true); h.setUint16(34, 16, true); w(36, 'data'); h.setUint32(40, pcm.byteLength, true);
  return new Blob([h, pcm], { type: 'audio/wav' });
}
window.renderOffline = renderOffline;
window.audioTestReady = true;

// interactive part
const snd = new Sound({ worklet: !new URLSearchParams(location.search).has('reserve') });   // ?reserve: the node-graph engine
let spec = carById(new URLSearchParams(location.search).get('car') || 'ravn'), mode = null, sc = null, t = 0, car = null, world = null, acc = 0, surf = SURF.ASPHALT;
const keys = new Set(), envUI = { inside: 0, sea: 0, forest: 0.5, rain: 0, wind: 0.2, night: 0, town: 0 };
for (const c of CARS) { const b = document.createElement('button'); b.textContent = `${c.name} (${voiceFor(c).layout}${c.engine.turbo ? ' turbo' : ''})`; b.onclick = () => pickCar(c.id); b.dataset.id = c.id; $('cars').append(b); }
SURF_NAME.forEach((n, i) => $('surf').append(new Option(n, i)));
$('surf').onchange = () => surf = +$('surf').value;
for (const [k, v, max] of [['inside', 0, 1], ['sea', 0, 1], ['forest', 0.5, 1], ['rain', 0, 1], ['wind', 0.2, 1], ['night', 0, 1], ['town', 0, 1], ['master', 0.8, 1], ['car', 1, 1], ['ambient', 0.7, 1]]) {
  const l = document.createElement('label'), r = document.createElement('input');
  r.type = 'range'; r.min = 0; r.max = max; r.step = 0.01; r.value = v; l.append(k, r); $('sliders').append(l);
  r.oninput = () => { if (k in envUI) envUI[k] = +r.value; else snd.setVolume({ [k]: +r.value }); };
}
const unlock = async () => { await snd.unlock(); snd.setCar(spec); };
function pickCar(id) {
  spec = carById(id); for (const b of $('cars').children) b.classList.toggle('on', b.dataset.id === id);
  offCar = fakeCar(spec); offCar.engineOff = true;
  if (snd.ac) unlock();
  if (mode) start(mode);
}
let offCar = null;
function start(m) {
  unlock(); mode = m; t = 0;
  for (const b of document.querySelectorAll('[data-mode]')) b.classList.toggle('on', b.dataset.mode === m);
  if (m === 'live') {
    world = flatWorld({ surf: () => surf, water: $('water').checked ? 0.3 : -Infinity });
    car = new Vehicle(spec); car.place(world, 0, 0, 0); for (let i = 0; i < 400; i++) car.step(1 / 400, world); sc = null;
  } else { sc = SC[m](spec); car = sc.car; }
}
$('unlock').onclick = unlock;
$('stop').onclick = () => { mode = null; sc = null; for (const b of document.querySelectorAll('[data-mode]')) b.classList.remove('on'); };
for (const b of document.querySelectorAll('[data-mode]')) b.onclick = () => start(b.dataset.mode);
for (const b of document.querySelectorAll('[data-ev]')) b.onclick = () => { unlock(); snd.event(b.dataset.ev, b.dataset.o ? JSON.parse(b.dataset.o) : {}); };
const horn = on => { unlock(); snd.event('horn', { on }); };
$('horn').onpointerdown = () => horn(true); $('horn').onpointerup = $('horn').onpointerleave = () => horn(false);
$('wav').onclick = async () => {
  const r = await renderOffline(spec.id, mode && mode !== 'live' ? mode : 'sweep'), bin = atob(r.b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const a = document.createElement('a'); a.href = URL.createObjectURL(wavBlob(u8, r.sr)); a.download = `${r.id}-${r.name}.wav`; a.click();
};
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); if (e.key.toLowerCase() === 'h' && !e.repeat) horn(true); if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); });
addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); if (e.key.toLowerCase() === 'h') horn(false); });
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!mode) { snd.update(dt, offCar, envUI); return; }     // engine off, the world per the sliders
  let env = envUI;
  if (mode === 'live') {
    const I = car.input, k = keys, ramp = (v, on, r) => on ? Math.min(1, v + dt * r) : Math.max(0, v - dt * r * 2);
    I.gas = ramp(I.gas, k.has('arrowup'), 3); I.brake = ramp(I.brake, k.has('arrowdown'), 4);
    I.steer += clamp((k.has('arrowleft') ? 1 : 0) - (k.has('arrowright') ? 1 : 0) - I.steer, -dt * 2.8, dt * 2.8); I.handbrake = k.has(' ') ? 1 : 0;
    acc += dt; let n = 0; while (acc >= 1 / 400 && n < 60) { car.step(1 / 400, world); acc -= 1 / 400; n++; }
  } else {
    t += dt; if (t > sc.dur) t = 0;
    sc.step(t, dt, snd); env = Object.assign({}, envUI, sc.env);
  }
  snd.update(dt, car, env);
  const st = car.state, W = car.wheels;
  $('out').textContent = `${spec.name}: ${voiceFor(spec).layout}, ${voiceFor(spec).cyl} syl. · lyd: ${snd.ready ? (snd.worklet ? 'AudioWorklet' : 'node-graf (reserve)') : 'ikke låst opp'} · ${snd.ac ? snd.ac.state : ''}
turtall ${car.rpm.toFixed(0)}  tenning ${firingHz(spec, car.rpm).toFixed(1)} Hz  last ${(st.load || 0).toFixed(2)}  gass ${(st.throttle || 0).toFixed(2)}  turbo ${(st.boost || 0).toFixed(2)}  gir ${st.gear}${st.shift > 0 ? ' (skifter)' : ''}
fart ${(Math.abs(car.speed) * 3.6).toFixed(0)} km/t  slipp ${W.map(w => (w.slipV || 0).toFixed(1)).join(' / ')} m/s  ${st.absOn ? 'ABS' : ''}  underlag ${SURF_NAME[W[0].surf]}${sc ? '  · skript ' + mode + ' ' + t.toFixed(1) + ' s: ' + (sc.segs.find(s => t >= s.t0 && t < s.t1) || {}).label : ''}`;
}
requestAnimationFrame(frame);
pickCar(spec.id);
</script>
</body>
</html>
